<!DOCTYPE html>
<html>
<head>
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="Bayanatz CMS — admin dashboard (private).">
    <!-- BUG-254: the admin must never be indexed by search engines. -->
    <meta name="robots" content="noindex, nofollow">

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Bayanatz">
    <link rel="apple-touch-icon" href="logo.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo.png"/>

    <title>Bayanatz</title>
    <link rel="manifest" href="manifest.json">

    <style>
        body {
            background-color: transparent !important;
            margin: 0;
            padding: 0;
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active,
        textarea:-webkit-autofill,
        textarea:-webkit-autofill:hover,
        textarea:-webkit-autofill:focus,
        textarea:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0px 1000px #F1F2ED inset !important;
            box-shadow: 0 0 0px 1000px #F1F2ED inset !important;
            -webkit-text-fill-color: #333333 !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
</head>
<body>
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
